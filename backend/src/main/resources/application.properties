server.address=127.0.0.1
server.port=${NANHU_PORT:8080}
server.servlet.session.cookie.name=NANHUSESSID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
spring.datasource.url=jdbc:h2:file:./runtime/nanhu
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.web.resources.static-locations=file:./frontend/dist/,classpath:/static/
nanhu.demo=${NANHU_DEMO:true}
nanhu.weather.endpoint=${NANHU_WEATHER_ENDPOINT:https://api.open-meteo.com/v1/forecast}
nanhu.weather.fresh=${NANHU_WEATHER_FRESH:PT15M}
nanhu.weather.retry=${NANHU_WEATHER_RETRY:PT2M}
nanhu.agent.base-url=${NANHU_AGENT_BASE_URL:}
nanhu.agent.model=${NANHU_AGENT_MODEL:}
nanhu.agent.api-key=${NANHU_AGENT_API_KEY:}
